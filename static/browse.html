<!DOCTYPE html>
<html id="docHTML">
<head>
  <meta content="text/html; charset=UTF-8" http-equiv="content-type">
   <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <script>
    // Suppress harmless ResizeObserver loop errors that block the UI
    window.addEventListener('error', function(e) {
      if (e.message && e.message.includes('ResizeObserver loop')) {
        e.stopImmediatePropagation();
        e.stopPropagation();
        e.preventDefault();
        return false;
      }
    }, true);
  </script>
  <link type="text/css" rel="stylesheet" href="mash.css" />
  <script type="text/javascript" src="mashlib.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const dom = document
    window.document.title = 'SolidOS Web App: ' + window.location.href
    const outliner = panes.getOutliner(dom)
    const { store, resource } = SolidLogic.solidLogicSingleton
    const uriField = dom.getElementById('uriField')
    const goButton = dom.getElementById('goButton')
    const pageHeader = dom.getElementById('PageHeader')
    const ready = panes.initializeProfileHeading(() =>
      new URLSearchParams(location.search).get('uri') || location.href)
    let navigationRequest = 0

    async function go () {
      const request = ++navigationRequest
      const target = new URL(uriField.value, window.location.href)
      await ready
      if (request !== navigationRequest) return

      const subject = $rdf.sym(target.href)
      let isContainer = false
      try {
        // The shared authenticated fetcher loads RDF and HTTP Link types into the store.
        const response = await store.fetcher.load(subject.doc())
        const canonical = new URL(response.url || target.href)
        canonical.hash = target.hash
        const canonicalSubject = $rdf.sym(canonical.href)
        isContainer = resource.isContainer(subject.doc()) || resource.isContainer(canonicalSubject.doc())
        if (isContainer) {
          if (!canonical.pathname.endsWith('/')) canonical.pathname += '/'
          target.href = canonical.href
        }
      } catch (error) {
        // The outliner below renders the resource's access-denied or load-error view.
        console.warn('Could not preload the browse resource.', error)
      }
      if (request !== navigationRequest) return

      uriField.value = target.href
      const pageUrl = new URL(window.location.href)
      pageUrl.searchParams.set('uri', target.href)
      window.history.replaceState({}, '', pageUrl)

      const options = isContainer
        ? { folderView: 'explorer', preserveUrl: true }
        : { preserveUrl: true }
      outliner.GotoSubject($rdf.sym(target.href), true, undefined, true, undefined, undefined, options)
      await panes.refreshProfileHeading(true)
    }

    function navigate () {
      if (!uriField.value.trim()) return
      go().catch(error => console.error('Failed to browse the resource.', error))
    }

    function updateHeaderOffset () {
      if (!pageHeader) return
      const headerHeight = Math.ceil(pageHeader.getBoundingClientRect().height)
      document.documentElement.style.setProperty('--browse-header-offset', `${headerHeight}px`)
    }

    window.addEventListener('resize', updateHeaderOffset)
    updateHeaderOffset()

    uriField.addEventListener('keydown', event => {
      if (event.key === 'Enter') navigate()
    })
    goButton.addEventListener('click', navigate)

    const authSession = SolidLogic.authn.authSession
    for (const event of ['login', 'sessionRestore', 'logout', 'sessionChange', 'identityReplaced']) {
      authSession.events.on(event, navigate)
    }

    const initial = new URLSearchParams(location.search).get('uri') ||
      (location.pathname === '/' ? location.href : '')
    if (initial) {
      uriField.value = initial
      navigate()
    }
});
</script>
</head>
<body>
  <solid-ui-provider>
    <header id="PageHeader" role="banner" class="header-mash">
        SolidOS Databrowser
        <div class="input-row" id="inputArea">
            Viewing <input id="uriField" type="text" class="uri-field" placeholder="enter a pod address e.g. https://you.solidcommunity.net/"/> <input type="button" id="goButton" value="Go" />
        </div>
    </header>
    <div class="user-row">
        <solid-ui-account></solid-ui-account>
    </div>
    <main id="MainContent" tabindex="-1" aria-live="polite" class="app-view browser-main">
        <div
            id="OutlineView"
            class="outline-view"
            aria-label="Resource browser"
            style="width: 100%"
        >
        </div>

    </main>

  </solid-ui-provider>

  <style>
    body {
      padding-top: calc(var(--browse-header-offset, var(--app-header-height, 60.8px)) + 5.6px);
    }
    .outline-view {
      width: 100%;
    }
    .header-mash {
      padding:16px !important;
      background: #bbb !important;
    }
    .browser-main {
      margin-top: 0 !important;
    }
    .user-row {
      margin-top: 0;
      padding-top: 5.6px;
      padding-bottom: 8px;
      margin-left:1em;
    }
    #uriField, .uri-field {
      font-size:100%;
      min-width:25em;
      padding:8px;
      width:70%;
      margin-top:0.6em !important;
    }
    @media (max-width: 768px) {
      .header-mash {
        box-sizing: border-box;
        width: 100%;
        padding: 12px !important;
        overflow: hidden;
      }
      #inputArea {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      #uriField, .uri-field {
        box-sizing: border-box;
        flex: 1 1 192px;
        min-width: 0;
        width: auto;
        margin-top: 0 !important;
      }
      #goButton {
        flex: 0 0 auto;
      }
    }
  </style>

</body>
</html>
